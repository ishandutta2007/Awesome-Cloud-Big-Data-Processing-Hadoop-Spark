<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #93c5fd; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e0f2fe; }
    
    /* Keyframe Animations for Dynamic Aspect */
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-20px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.4; }
    }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    @keyframes streamLine {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .particle1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 20, 10; animation: streamLine 20s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Orbs / Particles (Behind content) -->
  <circle cx="150" cy="100" r="120" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulse-bg"/>
  <circle cx="1050" cy="300" r="140" fill="#818cf8" opacity="0.2" filter="url(#glow)" class="pulse-bg"/>
  <circle cx="900" cy="80" r="90" fill="#f43f5e" opacity="0.15" filter="url(#glow)" class="particle1"/>

  <!-- Background Data Streams / Flow Lines -->
  <path d="M -50 320 Q 300 250 600 350 T 1250 280" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="data-stream"/>
  <path d="M -50 80 Q 400 180 800 60 T 1250 120" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="data-stream"/>

  <!-- Dynamic Background Grid / Tech Elements -->
  <g opacity="0.1">
    <line x1="100" y1="0" x2="100" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Content Container Card (Glassmorphic Foreground Container) -->
  <rect x="80" y="50" width="1040" height="300" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Decorative Top Line Accent -->
  <rect x="80" y="50" width="1040" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Foreground Title and Subtitle (Guaranteed visible and unblocked) -->
  <g transform="translate(120, 130)">
    <!-- Main Title -->
    <text x="0" y="35" class="title">
      Awesome Cloud Big Data Processing 🐘 ⚡
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="85" class="subtitle">
      Managed Hadoop, Spark, Lakehouse Architectures &amp; Distributed Query Engines
    </text>

    <!-- Feature Badges Pill Container -->
    <g transform="translate(0, 125)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="36" rx="18" fill="#0284c7" opacity="0.6"/>
      <text x="85" y="23" class="badge-text" text-anchor="middle">☁️ Cloud SaaS</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="190" height="36" rx="18" fill="#4f46e5" opacity="0.6"/>
      <text x="280" y="23" class="badge-text" text-anchor="middle">⚡ Apache Spark</text>

      <!-- Pill 3 -->
      <rect x="390" y="0" width="170" height="36" rx="18" fill="#0d9488" opacity="0.6"/>
      <text x="475" y="23" class="badge-text" text-anchor="middle">🐘 Hadoop &amp; HDFS</text>

      <!-- Pill 4 -->
      <rect x="575" y="0" width="180" height="36" rx="18" fill="#e11d48" opacity="0.6"/>
      <text x="665" y="23" class="badge-text" text-anchor="middle">🏞️ Lakehouse Tech</text>
    </g>
  </g>
</svg>
