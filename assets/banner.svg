<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".12"/><stop offset="100%" stop-color="#fff" stop-opacity=".03"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-20px) scale(1.1);opacity:.8}}@keyframes pulseGlow{0%{opacity:.3}50%{opacity:.7}}@keyframes streamLine{0%{stroke-dashoffset:1000}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#93c5fd}.badge-text{font-weight:600;font-size:14px;fill:#e0f2fe}.particle1{animation:floatParticle 6s ease-in-out infinite}.pulse-bg{animation:pulseGlow 4s ease-in-out infinite}.data-stream{stroke-dasharray:20,10;animation:streamLine 20s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><circle cx="150" cy="100" r="120" fill="#38bdf8" class="pulse-bg" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="300" r="140" fill="#818cf8" class="pulse-bg" filter="url(#glow)" opacity=".2"/><circle cx="900" cy="80" r="90" fill="#f43f5e" class="particle1" filter="url(#glow)" opacity=".15"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 320 Q 300 250 600 350 T 1250 280" class="data-stream" opacity=".3"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M -50 80 Q 400 180 800 60 T 1250 120" class="data-stream" opacity=".3"/><g opacity=".1"><line x1="100" x2="100" y1="0" y2="400" stroke="#fff" stroke-width="1"/><line x1="300" x2="300" y1="0" y2="400" stroke="#fff" stroke-width="1"/><line x1="500" x2="500" y1="0" y2="400" stroke="#fff" stroke-width="1"/><line x1="700" x2="700" y1="0" y2="400" stroke="#fff" stroke-width="1"/><line x1="900" x2="900" y1="0" y2="400" stroke="#fff" stroke-width="1"/><line x1="1100" x2="1100" y1="0" y2="400" stroke="#fff" stroke-width="1"/></g><rect width="1040" height="300" x="80" y="50" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".2" stroke-width="1.5" rx="20"/><rect width="1040" height="6" x="80" y="50" fill="url(#accentGrad)" rx="3"/><g><text x="0" y="35" class="title" transform="translate(120, 130)">Awesome Cloud Big Data Processing 🐘 ⚡</text><text x="0" y="85" class="subtitle" transform="translate(120, 130)">Managed Hadoop, Spark, Lakehouse Architectures &amp; Distributed Query Engines</text><g transform="translate(120, 130) translate(0, 125)"><rect width="170" height="36" x="0" y="0" fill="#0284c7" opacity=".6" rx="18"/><text x="85" y="23" class="badge-text" text-anchor="middle">☁️ Cloud SaaS</text><rect width="190" height="36" x="185" y="0" fill="#4f46e5" opacity=".6" rx="18"/><text x="280" y="23" class="badge-text" text-anchor="middle">⚡ Apache Spark</text><rect width="170" height="36" x="390" y="0" fill="#0d9488" opacity=".6" rx="18"/><text x="475" y="23" class="badge-text" text-anchor="middle">🐘 Hadoop &amp; HDFS</text><rect width="180" height="36" x="575" y="0" fill="#e11d48" opacity=".6" rx="18"/><text x="665" y="23" class="badge-text" text-anchor="middle">🏞️ Lakehouse Tech</text></g></g></svg>